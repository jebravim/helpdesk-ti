<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Helpdesk TI{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <a href="{{ url_for('index') }}" class="logo">🖥️ Helpdesk TI</a>
        <a href="{{ url_for('novo_chamado') }}" class="btn-novo">+ Novo Chamado</a>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
