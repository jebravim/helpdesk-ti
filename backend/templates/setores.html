{% extends "base.html" %}

{% block title %}Setores{% endblock %}

{% block content %}
<h1>Setores</h1>

{% if erro %}
<div class="alert-erro">{{ erro }}</div>
{% endif %}

<form class="formulario" method="POST" action="{{ url_for('gerenciar_setores') }}">
    <label for="nome">Novo setor</label>
    <input type="text" id="nome" name="nome" required placeholder="Ex: Diretoria">

    <button type="submit" class="btn-primario">Adicionar setor</button>
</form>

{% if setores %}
<div class="tabela-wrapper">
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Nome</th>
            </tr>
        </thead>
        <tbody>
            {% for s in setores %}
            <tr>
                <td>{{ s.id }}</td>
                <td>{{ s.nome }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% else %}
<p class="vazio">Nenhum setor cadastrado ainda.</p>
{% endif %}
{% endblock %}
