{% extends "base.html" %}

{% block title %}Editar Técnico{% endblock %}

{% block content %}
<h1>Editar técnico</h1>

{% if erro %}
<div class="alert-erro">{{ erro }}</div>
{% endif %}

<form class="formulario" method="POST" action="{{ url_for('editar_tecnico', usuario_id=tecnico.id) }}">
    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" required value="{{ tecnico.nome }}">

    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required value="{{ tecnico.email }}">

    <label for="setor">Setor (opcional)</label>
    <input type="text" id="setor" name="setor" value="{{ tecnico.setor or '' }}">

    <label for="tipo">Permissão</label>
    <select id="tipo" name="tipo">
        <option value="tecnico" {% if tecnico.tipo == 'tecnico' %}selected{% endif %}>Técnico</option>
        <option value="admin" {% if tecnico.tipo == 'admin' %}selected{% endif %}>Admin</option>
    </select>

    <label for="senha">Nova senha (opcional)</label>
    <input type="password" id="senha" name="senha" minlength="6"
           placeholder="Deixe em branco para manter a senha atual">

    <button type="submit" class="btn-primario">Salvar alterações</button>
</form>

<form method="POST" action="{{ url_for('excluir_tecnico', usuario_id=tecnico.id) }}"
      onsubmit="return confirm('Tem certeza que deseja excluir este técnico? Essa ação não pode ser desfeita.');">
    <button type="submit" class="btn-novo" style="background:#e74c3c; margin-top: 16px;">
        Excluir técnico
    </button>
</form>

<a href="{{ url_for('gerenciar_tecnicos') }}" class="voltar">← Voltar para a lista</a>
{% endblock %}
