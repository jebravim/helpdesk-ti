<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo chamado | Helpdesk TI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Novo chamado</h1>

            <p>
                Preencha os dados abaixo para registrar seu chamado.
            </p>

            {% if erro %}
                <div class="alert alert-danger">
                    {{ erro }}
                </div>
            {% endif %}

            <form method="POST">

                <!-- TÍTULO -->
                <div class="form-group">

                    <label for="titulo">
                        Título
                    </label>

                    <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        placeholder="Digite o título do chamado"
                        required
                    >

                </div>


                <!-- DESCRIÇÃO -->
                <div class="form-group">

                    <label for="descricao">
                        Descrição
                    </label>

                    <textarea
                        id="descricao"
                        name="descricao"
                        rows="6"
                        placeholder="Descreva o problema ou solicitação"
                        required
                    ></textarea>

                </div>


                <!-- NOME -->
                <div class="form-group">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <!-- SETOR -->
                <div class="form-group">

                    <label for="setor">
                        Setor
                    </label>

                    <select
                        id="setor"
                        name="setor"
                        required
                    >

                        <option value="">
                            Selecione seu setor
                        </option>

                        {% for setor in setores %}

                            <option value="{{ setor.setor }}">
                                {{ setor.setor }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- PRIORIDADE -->
                <div class="form-group">

                    <label for="prioridade">
                        Prioridade
                    </label>

                    <select
                        id="prioridade"
                        name="prioridade"
                        required
                    >

                        <option value="">
                            Selecione a prioridade
                        </option>

                        <option value="baixa">
                            Baixa
                        </option>

                        <option value="media">
                            Média
                        </option>

                        <option value="alta">
                            Alta
                        </option>

                        <option value="critica">
                            Crítica
                        </option>

                    </select>

                </div>


                <!-- BOTÃO -->
                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Registrar chamado
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
