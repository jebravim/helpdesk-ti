{% extends "base.html" %}
{% block title %}Novo Chamado | Helpdesk TI{% endblock %}
{% block content %}

<h1>Abrir novo chamado</h1>

<form method="post" class="formulario">
    <label for="titulo">Título</label>
    <input type="text" id="titulo" name="titulo" required placeholder="Ex: Impressora não imprime">

    <label for="descricao">Descrição</label>
    <textarea id="descricao" name="descricao" rows="4" placeholder="Descreva o problema com detalhes"></textarea>

    <label for="prioridade">Prioridade</label>
    <select id="prioridade" name="prioridade">
        <option value="baixa">Baixa</option>
        <option value="media" selected>Média</option>
        <option value="alta">Alta</option>
        <option value="urgente">Urgente</option>
    </select>

    <label for="solicitante_id">Solicitante</label>
    <select id="solicitante_id" name="solicitante_id">
        <option value="">Selecione...</option>
        {% for u in usuarios %}
        <option value="{{ u.id }}">{{ u.nome }}</option>
        {% endfor %}
    </select>

    <label for="tecnico_id">Técnico</label>
    <select id="tecnico_id" name="tecnico_id">
        <option value="">Selecione...</option>
        {% for u in usuarios %}
        <option value="{{ u.id }}">{{ u.nome }}</option>
        {% endfor %}
    </select>

    <label for="equipamento_id">Equipamento (opcional)</label>
    <select id="equipamento_id" name="equipamento_id">
        <option value="">Nenhum</option>
        {% for e in equipamentos %}
        <option value="{{ e.id }}">{{ e.tipo }} - {{ e.modelo }}</option>
        {% endfor %}
    </select>

    <button type="submit" class="btn-primario">Abrir chamado</button>
</form>

{% endblock %}
