{% extends "base.html" %}

{% block title %}Abrir Chamado{% endblock %}

{% block content %}
<h1>Abrir novo chamado</h1>

{% if erro %}
<div class="alert-erro">{{ erro }}</div>
{% endif %}

<form class="formulario" method="POST" action="{{ url_for('novo_chamado') }}">
    <label for="nome">Seu nome</label>
    <input type="text" id="nome" name="nome" required value="{{ request.form.nome or '' }}">

    <label for="setor">Setor</label>
    <select id="setor" name="setor" required>
        <option value="">Selecione...</option>
        {% for s in setores %}
        <option value="{{ s.nome }}" {% if request.form.setor == s.nome %}selected{% endif %}>
            {{ s.nome }}
        </option>
        {% endfor %}
    </select>

    <label for="prioridade">Prioridade</label>
    <select id="prioridade" name="prioridade" required>
        <option value="baixa" {% if request.form.prioridade == 'baixa' %}selected{% endif %}>Baixa</option>
        <option value="media" {% if not request.form.prioridade or request.form.prioridade == 'media' %}selected{% endif %}>Média</option>
        <option value="alta" {% if request.form.prioridade == 'alta' %}selected{% endif %}>Alta</option>
        <option value="urgente" {% if request.form.prioridade == 'urgente' %}selected{% endif %}>Urgente</option>
    </select>

    <label for="titulo">Título</label>
    <input type="text" id="titulo" name="titulo" required value="{{ request.form.titulo or '' }}">

    <label for="descricao">Descrição</label>
    <textarea id="descricao" name="descricao" rows="5" required>{{ request.form.descricao or '' }}</textarea>

    <button type="submit" class="btn-primario">Abrir chamado</button>
</form>
{% endblock %}
